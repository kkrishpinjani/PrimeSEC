# Trimmed OpenCTI for a single laptop: core platform + one worker + three free, keyless data connectors.
# Derived from OpenCTI's official docker-compose.yml with the XTM One / composer / pgvector services and the import connectors left out.
# Everything is published on 127.0.0.1 only. Secrets come from .env (git-ignored).
# Run:  docker compose -f compose.primesec.yaml up -d
services:
  redis:
    image: redis:8.10.1
    mem_limit: 256m
    restart: always
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 3 }
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.21
    volumes: [esdata:/usr/share/elasticsearch/data]
    environment:
      - discovery.type=single-node
      - xpack.ml.enabled=false
      - xpack.security.enabled=false
      - thread_pool.search.queue_size=5000
      - 'logger.org.elasticsearch.discovery="ERROR"'
      - "ES_JAVA_OPTS=-Xms${ELASTIC_MEMORY_SIZE} -Xmx${ELASTIC_MEMORY_SIZE}"
    restart: always
    mem_limit: 1700m
    ulimits: { memlock: { soft: -1, hard: -1 }, nofile: { soft: 65536, hard: 65536 } }
    healthcheck: { test: ["CMD-SHELL", "curl -s http://elasticsearch:9200/_cluster/health?wait_for_status=yellow >/dev/null || exit 1"], interval: 5s, timeout: 3s, retries: 60 }
  minio:
    image: pgsty/silo:latest
    mem_limit: 256m
    volumes: [s3data:/data]
    environment: { MINIO_ROOT_USER: "${MINIO_ROOT_USER}", MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}" }
    command: server /data
    restart: always
    healthcheck: { test: ["CMD", "mc", "ready", "local"], interval: 10s, timeout: 5s, retries: 3 }
  rabbitmq:
    image: rabbitmq:4.3-management
    mem_limit: 512m
    environment: ["RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}", "RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}", "RABBITMQ_NODENAME=rabbit01@localhost"]
    volumes:
      - { type: bind, source: ./rabbitmq.conf, target: /etc/rabbitmq/rabbitmq.conf }
      - amqpdata:/var/lib/rabbitmq
    restart: always
    healthcheck: { test: rabbitmq-diagnostics -q ping, interval: 30s, timeout: 30s, retries: 3 }

  opencti:
    image: opencti/platform:7.261030.1
    environment:
      - NODE_OPTIONS=--max-old-space-size=1536
      - APP__PORT=8080
      - APP__BASE_URL=${OPENCTI_EXTERNAL_SCHEME}://${OPENCTI_HOST}:${OPENCTI_PORT}
      - APP__ADMIN__EMAIL=${OPENCTI_ADMIN_EMAIL}
      - APP__ADMIN__PASSWORD=${OPENCTI_ADMIN_PASSWORD}
      - APP__ADMIN__TOKEN=${OPENCTI_ADMIN_TOKEN}
      - APP__ENCRYPTION_KEY=${OPENCTI_ENCRYPTION_KEY}
      - REDIS__HOSTNAME=redis
      - REDIS__PORT=6379
      - ELASTICSEARCH__URL=http://elasticsearch:9200
      - ELASTICSEARCH__NUMBER_OF_REPLICAS=0
      - MINIO__ENDPOINT=minio
      - MINIO__PORT=9000
      - MINIO__USE_SSL=false
      - MINIO__ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO__SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - RABBITMQ__HOSTNAME=rabbitmq
      - RABBITMQ__PORT=5672
      - RABBITMQ__PORT_MANAGEMENT=15672
      - RABBITMQ__MANAGEMENT_SSL=false
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - PROVIDERS__LOCAL__STRATEGY=LocalStrategy
      - APP__HEALTH_ACCESS_KEY=${OPENCTI_HEALTHCHECK_ACCESS_KEY}
    mem_limit: 2000m
    ports: ["127.0.0.1:${OPENCTI_PORT}:8080"]
    depends_on:
      redis: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      minio: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: always
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://opencti:8080/health?health_access_key=${OPENCTI_HEALTHCHECK_ACCESS_KEY}"], interval: 10s, timeout: 5s, retries: 30 }
  worker:
    image: opencti/worker:7.261030.1
    mem_limit: 500m
    environment: ["OPENCTI_URL=http://opencti:8080", "OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}"]
    depends_on: { opencti: { condition: service_healthy } }
    restart: always

  connector-opencti:
    image: opencti/connector-opencti:7.261030.1
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_OPENCTI_ID}
      - CONNECTOR_NAME=OpenCTI Datasets
      - CONNECTOR_SCOPE=marking-definition,identity,location
      - CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT=true
      - CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT_CONFIDENCE_LEVEL=100
    restart: always
    depends_on: { opencti: { condition: service_healthy } }
  connector-mitre:
    image: opencti/connector-mitre:7.261030.1
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_MITRE_ID}
      - CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT=true
      - CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT_CONFIDENCE_LEVEL=75
    restart: always
    depends_on: { opencti: { condition: service_healthy } }
  connector-cisa-kev:
    image: opencti/connector-cisa-known-exploited-vulnerabilities:7.261030.1
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_CISA_ID}
      - CONNECTOR_NAME=CISA Known Exploited Vulnerabilities
      - CONNECTOR_SCOPE=cisa
      - CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT=true
      - CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT_CONFIDENCE_LEVEL=75
      - CONNECTOR_LOG_LEVEL=info
      - CONNECTOR_DURATION_PERIOD=PT24H
      - CISA_CATALOG_URL=https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
      - CISA_TLP=TLP:CLEAR
    restart: always
    depends_on: { opencti: { condition: service_healthy } }

volumes: { esdata: , s3data: , redisdata: , amqpdata: }
