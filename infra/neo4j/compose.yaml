# Neo4j Community for PrimeSEC's security graph (local test). Both ports are published on 127.0.0.1 only: HTTP 7474 (PrimeSEC talks to
# Neo4j over its HTTP transactional API) and Bolt 7687 (so the Neo4j Browser at http://127.0.0.1:7474 can connect: bolt://localhost:7687). Community Edition has a single built-in user; there is no role-based access control.
# Run:  docker compose up -d      Password comes from .env (git-ignored).
services:
  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      # Login is OFF: both ports are published on 127.0.0.1 only, and the dashboard opens the browser with no credentials (see lib/launch.ts).
      # To turn the login back on, set this to neo4j/${NEO4J_PASSWORD} (the password in .env).
      NEO4J_AUTH: none
      NEO4J_server_memory_heap_initial__size: 384m
      NEO4J_server_memory_heap_max__size: 384m
      NEO4J_server_memory_pagecache_size: 192m
      NEO4J_server_bolt_listen__address: 0.0.0.0:7687
      NEO4J_server_http_listen__address: 0.0.0.0:7474
      NEO4J_server_https_enabled: "false"
    ports:
      - 127.0.0.1:7474:7474
      - 127.0.0.1:7687:7687
    volumes:
      - neo4jdata:/data
    mem_limit: 1200m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
volumes:
  neo4jdata:
